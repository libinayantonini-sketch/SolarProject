; ESP32 "esp32dev" (ESP32-WROOM-32, sem PSRAM). NÃO TESTADO em hardware neste repositório: veja docs/04_FIRMWARE_ESP32.md.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
    bitbank2/JPEGDEC @ ^1.5.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Etapa de validação com LED: GPIO 2 é o LED da placa. Para a bomba real, troque por o pino do MOSFET (ex.: 26).
    -DPUMP_PIN=2
    -DPUMP_ACTIVE_LEVEL=HIGH
